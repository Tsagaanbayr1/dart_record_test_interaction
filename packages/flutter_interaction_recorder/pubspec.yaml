name: flutter_interaction_recorder
description: A Flutter package that records user interactions with test IDs and generates integration test code. Overlay a record button on any app, capture every tap, text input, and navigation, then export reusable, componentized test flows.
version: 0.1.1
homepage: https://github.com/your-org/flutter_interaction_recorder
repository: https://github.com/your-org/flutter_interaction_recorder

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
